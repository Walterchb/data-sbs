name: Sincronizar BanBif Regulatory Hub

on:
  workflow_dispatch:
  schedule:
    - cron: "35 12 * * *"
  push:
    branches: [main]
    paths: ["scripts/**", "config/**", "tests/**", "requirements.txt", ".github/workflows/sync-hub.yml"]

permissions:
  contents: write

concurrency:
  group: banbif-regulatory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar lector XLS
        run: python -m pip install -r requirements.txt
      - name: Instalar herramientas de prueba
        run: npm ci --ignore-scripts
      - name: Descargar, procesar y validar SBS
        run: python scripts/sync_hub.py
      - name: Tests de datos y parsers
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Tests de cálculos del frontend
        run: npm test
      - name: Verificar entrega y fechas de frontend
        run: python scripts/validate_project.py
      - name: Resumen de calidad
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('data/data_health.json')
          if not path.exists():
              raise SystemExit('No se generó DATA HEALTH')
          h=json.loads(path.read_text())
          lines=['## DATA HEALTH','','| Fuente | Estado | Último dato | Observaciones |','|---|---|---|---:|']
          for d in h['datasets']:
              lines.append(f"| {d['dataset']} | {d['status']} | {d['latest_period']} | {d['rows']} |")
          lines+=['',f"Errors: {h['errors']} · Warnings: {h['warnings']}"]
          for d in h['datasets']:
              for message in d['errors']+d['warnings']:
                  lines.append(f"- {d['dataset']}: {message}")
          text='\n'.join(lines)+'\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(text)
          PY
      - name: Guardar diagnósticos de la ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbs-data-health-${{ github.run_number }}
          path: data/data_health.json
          retention-days: 14
      - name: Publicar únicamente outputs validados
        run: |
          set -euo pipefail
          git add data/hub.json data/manifest.json data/overview.json data/financial.json data/data_health.json data/reports/ data/entities/
          if git diff --cached --quiet; then
            echo "Datos sin cambios: no se crea commit."
            exit 0
          fi
          git config user.name "sbs-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "SBS: actualizar datos y controles validados"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main cambió durante la ejecución. Reejecuta el workflow sobre la versión nueva."
            exit 1
          fi
          git push origin HEAD:main
