name: Sincronizar BanBif Regulatory Hub

on:
  workflow_dispatch:
  schedule:
    - cron: "35 12 * * *"
  push:
    branches: [ main ]
    paths:
      - "scripts/sync_hub.py"
      - "requirements.txt"
      - ".github/workflows/sync-hub.yml"

permissions:
  contents: write

concurrency:
  group: banbif-regulatory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python - <<'PY'
          import xlrd
          print("xlrd OK:", xlrd.__version__)
          PY

      - name: Sincronizar SBS
        run: python scripts/sync_hub.py

      - name: Mostrar salud de fuentes
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/hub.json",encoding="utf-8"))
          print("\nFUENTE      ESTADO   PERIODOS  ULTIMO       ERRORES")
          print("-"*55)
          for code,x in d.get("meta",{}).get("source_health",{}).items():
              print(f"{code:10} {x.get('status','-'):8} {x.get('loaded',0):8}  {str(x.get('latest') or '-'):10}  {x.get('errors',0):7}")
          PY

      - name: Guardar cambios
        run: |
          git config user.name "sbs-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hub.json
          git diff --cached --quiet || git commit -m "SBS: actualizar Regulatory & Financial Hub"
          git pull --rebase
          git push
