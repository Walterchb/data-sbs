<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Análisis financiero BanBif: balance SBS, movimientos materiales, indicadores regulatorios y comparación bancaria con trazabilidad de fuentes."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Información Financiera SBS · Treasury Hub</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./assets/app.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"
    ></script>
    <script type="module" src="./assets/js/app.js"></script>
  </head>
  <body>
    <a href="#content" class="skip">Ir al análisis</a>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="logo" aria-hidden="true">BIF</div>
          <div>
            <strong>Información Financiera SBS</strong>
            <p>BanBif · Treasury Hub</p>
          </div>
        </div>
        <div class="actions top-actions">
          <button
            id="health-status"
            class="header-status"
            data-nav="health"
            title="Ver fechas y calidad de las fuentes"
          >
            <span class="dot" aria-hidden="true"></span
            ><span id="health-label">Consultando</span>
          </button>
          <button
            id="info"
            class="icon-only"
            type="button"
            data-popup="info"
            aria-label="Información del corte y las fuentes"
            aria-haspopup="dialog"
          >
            <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
          </button>
          <button
            id="refresh"
            type="button"
            class="icon-only"
            title="Actualizar información"
            aria-label="Actualizar información"
          >
            <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
          </button>
          <button
            id="theme"
            type="button"
            class="icon-only"
            title="Tema oscuro"
            aria-label="Tema oscuro"
          >
            <i class="fa-solid fa-moon" aria-hidden="true"></i>
          </button>
          <button
            id="export"
            type="button"
            class="icon-only"
            title="Descargar CSV de esta vista"
            aria-label="Descargar CSV de esta vista"
          >
            <i class="fa-solid fa-download" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </header>
    <div class="workspace">
      <main id="main">
        <div class="analysis-toolbar">
          <div class="commandbar">
            <div>
              <span class="eyebrow">FECHA SBS</span>
              <div class="period-controls">
                <button
                  id="prev"
                  aria-label="Periodo anterior"
                  title="Periodo anterior"
                >
                  <i
                    class="fa-solid fa-caret-left"
                    aria-hidden="true"
                  ></i></button
                ><label class="sr-only" for="period">Periodo SBS</label
                ><span class="date-picker-wrap"
                  ><input
                    id="period"
                    type="date"
                    disabled
                    aria-label="Seleccionar fecha SBS" /><i
                    class="fa-regular fa-calendar-days date-fa"
                    aria-hidden="true"
                  ></i></span
                ><button
                  id="next"
                  aria-label="Periodo siguiente"
                  title="Periodo siguiente"
                >
                  <i
                    class="fa-solid fa-caret-right"
                    aria-hidden="true"
                  ></i></button
                ><button id="last">Último</button>
              </div>
            </div>
          </div>
          <nav
            id="navigation"
            class="section-nav"
            aria-label="Secciones del análisis"
          ></nav>
        </div>
        <div id="error" class="notice error" role="alert" hidden></div>
        <div id="content" tabindex="-1" aria-busy="true">
          <div class="empty">Cargando información financiera…</div>
        </div>
      </main>
    </div>
    <footer class="site-footer">
      <div class="site-footer-inner">
        <div>
          <strong>BanBif · Treasury Hub</strong
          ><span>Fuente: Superintendencia de Banca, Seguros y AFP.</span>
        </div>
        <div>
          <span id="latest">Consultando periodos…</span
          ><button class="text-button" data-nav="health">
            Fechas, fuentes y metodología
            <i
              class="fa-solid fa-arrow-up-right-from-square"
              aria-hidden="true"
            ></i>
          </button>
        </div>
      </div>
    </footer>
    <div
      id="hover-detail"
      class="detail-popover"
      role="dialog"
      aria-label="Detalle"
      hidden
    ></div>
    <dialog
      id="detail-dialog"
      class="detail-dialog"
      aria-labelledby="detail-title"
    >
      <button
        id="detail-close"
        class="detail-close"
        type="button"
        aria-label="Cerrar detalle"
      >
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
      <div id="detail-body"></div>
    </dialog>
    <div id="toast" role="status" class="toast" hidden></div>
  </body>
</html>
